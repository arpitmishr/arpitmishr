<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- 1. Sidebar Navigation -->
    <nav class="sidebar">
        <h2>Tenant Mgr</h2>
        <ul>
            <li onclick="switchView('dashboard')" class="active">Dashboard</li>
            <li onclick="switchView('rooms')">Rooms</li>
            <li onclick="switchView('tenants')">Tenants</li>
            <li onclick="switchView('dues')">Dues & Payments</li>
            <li onclick="switchView('readings')">Utility Readings</li>
            <li onclick="switchView('settings')">Settings</li>
        </ul>


      <!-- File Upload Section in Sidebar -->
<div style="margin-top: 20px; border-top: 1px solid #334155; padding-top: 10px;">
    <label for="jsonFileInput" style="font-size: 12px; display: block; margin-bottom: 5px;">Import JSON Data:</label>
    <input type="file" id="jsonFileInput" accept=".json" style="color: white; font-size: 11px; width: 100%;">
    <button id="processFileBtn" style="background-color: #0ea5e9; margin-top: 5px; width: 100%; font-size: 12px;">Process & Upload</button>
</div>


        
    </nav>

    <!-- 2. Main Content Area -->
    <main class="content">
        <header>
            <h1 id="pageTitle">Overview</h1>
            <div id="userInfo">Loading...</div>
        </header>

        <!-- Dynamic Content loads here -->
        <div id="appContainer">
            <p>Loading data from Firebase...</p>
        </div>
    </main>

    <!-- 3. Link JavaScript Files (Module type is required for Firebase) -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>


   
</body>
</html>
