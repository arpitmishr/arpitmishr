<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Records Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Palette */
            --primary-color: #4CAF50; /* Green */
            --primary-dark: #388E3C;
            --secondary-color: #2196F3; /* Blue */
            --accent-color: #FFC107; /* Amber */
            --danger-color: #F44336; /* Red */
            --warning-color: #FF9800; /* Orange */
            --success-color: #4CAF50; /* Green */

            /* Neutral Tones */
            --background-light: #f5f7fa;
            --background-dark: #e0e0e0;
            --card-background: #ffffff;
            --border-color: #e0e0e0;
            --text-dark: #333333;
            --text-light: #666666;

            /* Shadows */
            --shadow-light: rgba(0, 0, 0, 0.05) 0px 4px 6px -1px, rgba(0, 0, 0, 0.03) 0px 2px 4px -1px;
            --shadow-medium: rgba(0, 0, 0, 0.1) 0px 10px 15px -3px, rgba(0, 0, 0, 0.05) 0px 4px 6px -2px;

            /* Spacing & Borders */
            --border-radius: 12px;
            --padding-base: 1.5rem; /* Default padding for larger screens */
            --transition-speed: 0.3s;
        }

        /* Base Styles & Resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-light);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* Prevent horizontal scroll from accidental overflow */
        }

        /* Utility Classes */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: var(--padding-base);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr; /* Default: single column for mobile */
            gap: var(--padding-base);
            padding: var(--padding-base);
        }

        .view {
            display: none;
            flex-grow: 1;
            animation: fadeIn 0.3s ease-out;
        }
        .view.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Layout Structure --- */
        #app-container {
            display: none; /* Hidden by default until signed in */
            flex-grow: 1;
            width: 100%;
            flex-direction: column; /* Mobile-first: stack content vertically */
        }
        #app-container.visible {
            display: flex;
        }

        #sidebar {
            width: 100%;
            background-color: var(--card-background);
            border-top: 1px solid var(--border-color); /* Separator on mobile */
            padding: var(--padding-base) 0;
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
            order: 2; /* Pushed to bottom on mobile */
        }

        #main-content {
            flex-grow: 1;
            padding: 0; /* Handled by internal sections */
            overflow-y: auto;
            order: 1; /* Main content above sidebar on mobile */
        }

        /* --- Login Screen --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2f7 0%, #c8e6f1 100%);
            text-align: center;
            padding: var(--padding-base);
        }
        #login-screen h1 {
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            font-weight: 700;
        }
        #login-screen p {
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            max-width: 500px;
        }
        #signin-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color var(--transition-speed) ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--shadow-medium);
        }
        #signin-btn:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }
        #signin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        #signin-btn svg {
            width: 24px;
            height: 24px;
        }
        #auth-status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* --- Sidebar Navigation (Mobile-first) --- */
        .sidebar-header {
            padding: 0 var(--padding-base);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
        }
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: row; /* Horizontal nav for mobile */
            justify-content: space-around;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; /* Allow nav items to wrap if screen is very narrow */
        }
        .sidebar-nav li {
            margin-bottom: 0;
            width: 100%; /* Default to full width for stacking or even distribution */
            flex-grow: 1; /* Allow li to grow for even spacing */
        }
        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center; /* Center icon and text for mobile buttons */
            gap: 0.8rem;
            padding: 1rem var(--padding-base);
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 500;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
            border-bottom: 3px solid transparent; /* For active state on mobile */
            width: 100%; /* Ensure links take full width of their container */
        }
        .nav-link:hover {
            background-color: var(--background-dark);
        }
        .nav-link.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-dark); /* Highlight */
        }
        .nav-link.active:hover {
            background-color: var(--primary-dark);
        }
        .nav-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .user-profile {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 1rem var(--padding-base);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
        .user-profile.visible {
            display: flex;
        }
        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }
        .user-profile span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }
        .user-profile button {
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color var(--transition-speed) ease;
        }
        .user-profile button:hover {
            background-color: #d32f2f;
        }
        .sync-status {
            font-size: 0.8rem;
            color: var(--text-light);
            text-align: center;
            padding: 0.5rem 0;
        }

        /* --- Main Content Header (Mobile-first) --- */
        .section-header {
            display: flex;
            flex-direction: column; /* Stack title and actions on small screens */
            justify-content: space-between;
            align-items: flex-start; /* Align title to left */
            padding: var(--padding-base);
            background-color: var(--card-background);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem; /* Space below title before actions */
        }
        .header-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap; /* Allow buttons to wrap */
            justify-content: flex-start; /* Align actions to the left */
            width: 100%; /* Take full width to manage wrapping */
        }

        /* --- Dashboard --- */
        .metric-boxes {
            padding: var(--padding-base);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); /* Smaller min size for mobile */
            gap: 1rem; /* Smaller gap */
            background-color: var(--background-light);
        }
        .metric-box {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            padding: 1rem; /* Reduced padding */
            text-align: center;
            box-shadow: var(--shadow-light);
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }
        .metric-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }
        .metric-box h3 {
            font-size: 0.9rem; /* Smaller font size */
            color: var(--text-light);
            margin-bottom: 0.6rem;
            font-weight: 500;
        }
        .metric-box .metric-value {
            font-size: 1.8rem; /* Smaller metric value font size */
            font-weight: 700;
            color: var(--primary-color);
        }

        .dashboard-section {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            padding: var(--padding-base);
            box-shadow: var(--shadow-light);
        }
        .dashboard-section h3 {
            font-size: 1.1rem; /* Slightly smaller heading */
            color: var(--primary-dark);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem;
        }

        #alert-list .alert-item, #tenant-dues-list .alert-item {
            background-color: #fff3e0;
            border: 1px solid #ffb74d;
            color: #e65100;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem; /* Slightly smaller text */
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        #alert-list .alert-item.danger, #tenant-dues-list .alert-item.danger {
            background-color: #ffebee;
            border-color: #ef9a9a;
            color: #c62828;
        }
        #alert-list .alert-item.success {
            background-color: #e8f5e9;
            border-color: #a5d6a7;
            color: #2e7d32;
        }
        #alert-list .alert-item:last-child, #tenant-dues-list .alert-item:last-child {
            margin-bottom: 0;
        }
        #alert-list .alert-item span, #tenant-dues-list .alert-item span {
            font-weight: 600;
        }
        #tenant-dues-list .alert-item strong {
            font-weight: 700;
        }
        #alert-list .alert-item:hover, #tenant-dues-list .alert-item:hover {
            background-color: var(--background-dark);
        }

        /* --- Data Cards (Rooms, Tenants) --- */
        .data-card {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-light);
            cursor: pointer;
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
            display: flex;
            flex-direction: column;
        }
        .data-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }
        .card-photo {
            width: 100%;
            height: 160px; /* Slightly reduced height for mobile */
            background-color: var(--background-dark);
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0.8rem;
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .card-photo.tenant-avatar {
             height: 120px; /* Reduced avatar size */
             font-size: 2.5rem; /* Smaller font for initials */
             background-color: var(--secondary-color);
             display: flex;
             align-items: center;
             justify-content: center;
             font-weight: bold;
             color: white;
             text-transform: uppercase;
        }

        .card-status {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        .status-occupied { background-color: var(--danger-color); }
        .status-available { background-color: var(--primary-color); }
        .status-maintenance { background-color: var(--warning-color); }

        .card-content {
            padding: 1rem; /* Reduced padding */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 1.2rem; /* Slightly smaller title */
            margin-bottom: 0.4rem;
            color: var(--primary-dark);
            font-weight: 600;
            word-break: break-word; /* Prevent long words from overflowing */
        }
        .card-info {
            font-size: 0.9rem; /* Slightly smaller info text */
            color: var(--text-light);
            margin-bottom: 0.2rem;
            word-break: break-word; /* Prevent long words from overflowing */
        }

        /* --- Detail Views (Room & Tenant) --- */
        .detail-view-header {
            display: flex;
            flex-direction: column; /* Stack on mobile */
            align-items: center;
            padding: var(--padding-base);
            background-color: var(--card-background);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
            text-align: center;
        }
        .detail-photo {
            width: 120px; /* Smaller detail photo */
            height: 120px;
            border-radius: var(--border-radius);
            background-color: var(--background-dark);
            background-size: cover;
            background-position: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
            border: 3px solid var(--border-color);
        }
        .detail-info {
            flex-grow: 1;
        }
        .detail-info h2 {
            font-size: 1.8rem; /* Adjusted heading size */
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
        }
        .detail-info p {
            font-size: 1rem; /* Adjusted paragraph size */
            color: var(--text-light);
        }

        .detail-main, .detail-sidebar {
            display: flex;
            flex-direction: column;
            gap: var(--padding-base);
        }

        .detail-card {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            padding: 1rem; /* Reduced padding */
            box-shadow: var(--shadow-light);
        }
        .detail-card h4 {
            font-size: 1.1rem; /* Adjusted heading size */
            color: var(--primary-dark);
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }
        .detail-card ul {
            list-style: none;
        }
        .detail-card ul li {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.9rem; /* Adjusted list item font size */
        }
        .detail-card ul li:last-child {
            border-bottom: none;
        }
        .detail-card ul li span {
            color: var(--text-light);
        }
        .detail-card ul li strong {
            color: var(--text-dark);
        }
        .detail-card p {
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }
        .detail-card p strong {
            color: var(--text-dark);
        }
        .detail-card .alert-item {
            margin-bottom: 0.8rem;
        }

        #transaction-list .transaction-item {
            display: flex;
            flex-direction: column; /* Stack details and actions on small screens */
            align-items: flex-start;
            padding: 0.6rem 0;
            border-bottom: 1px dashed var(--border-color);
        }
        #transaction-list .transaction-item > div:first-child {
            width: 100%;
            margin-bottom: 0.4rem; /* Space between text and buttons */
        }
        #transaction-list .transaction-item:last-child {
            border-bottom: none;
        }
        #transaction-list .transaction-item p {
            margin: 0;
            font-size: 0.9rem; /* Adjusted transaction text size */
        }
        #transaction-list .transaction-item p strong {
            font-size: 1rem;
        }
        #transaction-list .transaction-item.due {
            color: var(--danger-color);
        }
        #transaction-list .transaction-item.payment {
            color: var(--success-color);
        }
        .transaction-actions {
            display: flex;
            gap: 0.5rem;
            width: 100%; /* Ensure buttons spread across if necessary */
            justify-content: flex-end; /* Push to the right */
        }
        .btn-icon svg {
            width: 18px; /* Slightly smaller icons */
            height: 18px;
            fill: currentColor;
        }

        /* --- Forms & Modals --- */
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-container:has(.modal.active) {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            max-width: 500px;
            width: 95%; /* Wider on small screens */
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            display: none;
            overflow: hidden; /* Prevent content from breaking modal bounds */
        }
        .modal.active {
            display: block;
            transform: translateY(0);
        }
        .modal-content {
            padding: 1rem; /* Reduced padding */
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-title {
            font-size: 1.3rem; /* Adjusted title size */
            color: var(--primary-dark);
            font-weight: 600;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem; /* Adjusted size */
            cursor: pointer;
            color: var(--text-light);
            transition: color var(--transition-speed) ease;
        }
        .close-btn:hover {
            color: var(--text-dark);
        }

        .form-group {
            margin-bottom: 1rem; /* Reduced margin */
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.9rem; /* Adjusted label font size */
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem; /* Reduced padding */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem; /* Adjusted font size */
            color: var(--text-dark);
            background-color: var(--background-light);
            transition: border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
            outline: none;
        }
        .form-group input[type="file"] {
            padding: 0.5rem 0;
            background-color: transparent;
            border: none;
        }
        .form-group img#photo-preview {
            max-width: 80px; /* Smaller preview image */
            max-height: 80px;
            margin-top: 0.8rem;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem; /* Reduced gap */
            margin-top: 1.5rem; /* Reduced margin */
            flex-wrap: wrap; /* Allow buttons to wrap */
        }
        .form-actions .action-btn {
            flex-grow: 1; /* Allow buttons to grow to fill space evenly */
        }


        /* --- Buttons --- */
        .action-btn {
            padding: 0.7rem 1.2rem; /* Reduced padding */
            border: none;
            border-radius: 8px;
            font-size: 0.9rem; /* Reduced font size */
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition-speed) ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .action-btn:active {
            transform: translateY(1px);
        }
        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #1976D2;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            background-color: #d32f2f;
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: var(--text-dark);
        }
        .btn-warning:hover:not(:disabled) {
            background-color: #f57c00;
        }

        .btn-cancel {
            background-color: var(--background-dark);
            color: var(--text-dark);
        }
        .btn-cancel:hover:not(:disabled) {
            background-color: #c0c0c0;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }
        .btn-whatsapp:hover:not(:disabled) {
            background-color: #1DA851;
        }
        .btn-whatsapp svg {
            width: 18px; /* Slightly smaller for mobile */
            height: 18px;
            fill: white;
        }

        /* --- Toast Notification --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1001;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.5s, visibility 0s linear 0.5s;
        }

        #toast.show {
            visibility: visible;
            animation: fadeInOut 3s forwards;
            opacity: 1;
            transition: opacity 0.5s, visibility 0s linear 0s;
        }

        #toast.success { background-color: var(--success-color); }
        #toast.error { background-color: var(--danger-color); }
        #toast.info { background-color: var(--secondary-color); }

        @keyframes fadeInOut {
            0% { bottom: 30px; opacity: 0; }
            10% { bottom: 50px; opacity: 1; }
            90% { bottom: 50px; opacity: 1; }

    <!-- Google Platform Library (for authentication and Drive API) -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>

    <script>
        // All JavaScript code goes here
        (window.onload = () => {
            const app = {
                // --- Configuration ---
                // >>>>>>> IMPORTANT: REPLACE THESE WITH YOUR ACTUAL GOOGLE CLOUD PROJECT CREDENTIALS <<<<<<<
                // CLIENT_ID: Go to Google Cloud Console -> APIs & Services -> Credentials -> OAuth 2.0 Client IDs (Web application)
                // API_KEY: Go to Google Cloud Console -> APIs & Services -> Credentials -> API Keys
                CLIENT_ID: '460969544827-21ethacfepnho56k8j89dtaq58rj0oem.apps.googleusercontent.com', 
                API_KEY: 'AIzaSyDJ3soSuJgHcbD8beauFPWd06wJWqws3ps', 
                SCOPES: 'https://www.googleapis.com/auth/drive.file', // Scope for app-specific files
                APP_FOLDER_NAME: 'TenantManagementApp',
                DATA_FILE_NAME: 'tenant_data.json', // The MASTER file for app operation
                MONTHLY_FILENAME_TEMPLATE: (month, year) => `${month.toLowerCase()}_${year}tenant_record.json`,
                
                tokenClient: null,
                appFolderId: null,
                driveFileId: null, // ID for the MASTER file
                isSaving: false,
                saveTimeout: null,
                userRole: 'owner', // 'owner' or 'viewer' - defaults to owner for first time use

                state: {
                    rooms: [], tenants: [], leftTenants: [], dues: [], payments: [], utilityReadings: [],
                    settings: { electricityRate: 8.00, currencySymbol: '₹' },
                    currentView: 'dashboard', detailViewId: null,
                    dashboardFilter: 'this_month'
                },

                // --- CORE: Initialization and Authentication ---
                init() {
                    gapi.load('client', this.initializeGapiClient.bind(this));
                    this.tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: this.CLIENT_ID,
                        scope: this.SCOPES,
                        callback: this.handleAuthResponse.bind(this),
                    });
                    document.getElementById('signin-btn').addEventListener('click', () => this.tokenClient.requestAccessToken({prompt: 'consent'}));
                    document.getElementById('signout-btn').addEventListener('click', this.signOut.bind(this));
                },

                async initializeGapiClient() {
                    try {
                        await gapi.client.init({
                            apiKey: this.API_KEY,
                            discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
                        });
                        document.getElementById('signin-btn').disabled = false;
                        document.getElementById('auth-status').textContent = 'Ready. Please sign in.';
                    } catch (error) {
                        console.error("Error initializing Google API client:", error);
                        document.getElementById('auth-status').textContent = 'Error initializing. Check API Key and console for details.';
                        this.showToast(`Error initializing Google APIs. Please check your network and API Key configuration in Google Cloud Console.`, 'error');
                    }
                },

                async handleAuthResponse(response) {
                    if (response.error) { 
                        console.error("Authentication Error:", response.error);
                        let errorMessage = `Authentication failed: ${response.error.error_description || response.error.message || JSON.stringify(response.error)}. Please ensure 'Authorized JavaScript origins' in your Google Cloud OAuth Client ID are correctly set for this page's URL.`;
                        this.showToast(errorMessage, 'error'); 
                        document.getElementById('auth-status').textContent = 'Authentication Failed.';
                        return; 
                    }
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-container').classList.add('visible');
                    document.getElementById('user-profile-container').classList.add('visible'); // Show user profile after login
                    await this.updateUserProfile();
                    await this.loadData();
                    this.startAppLogic();
                },
                
                signOut() {
                    const token = gapi.client.getToken();
                    if (token !== null) {
                        google.accounts.oauth2.revoke(token.access_token, () => {
                            gapi.client.setToken('');
                            this.driveFileId = null; this.appFolderId = null; this.userRole = 'owner'; // Reset role on sign out
                            document.getElementById('login-screen').style.display = 'flex';
                            document.getElementById('app-container').classList.remove('visible');
                            document.getElementById('user-profile-container').classList.remove('visible'); // Hide user profile on sign out
                            this.showToast('Signed out successfully.');
                        });
                    }
                },

                async updateUserProfile() {
                    try {
                        const res = await gapi.client.request({ path: 'https://www.googleapis.com/oauth2/v3/userinfo' });
                        document.getElementById('user-name').textContent = res.result.name;
                        document.getElementById('user-img').src = res.result.picture;
                    } catch (e) { console.error("Could not fetch user profile", e); }
                },
                
                startAppLogic() {
                    if (this.isOwner()) {
                        const duesGenerated = this.generateMissingRentDues();
                        if (duesGenerated > 0) { this.triggerAutoSave(); this.showToast(`${duesGenerated} new rent due(s) generated.`); }
                    } else {
                        this.showToast('Logged in as Viewer. Actions are restricted.', 'info');
                    }
                    this.addEventListeners();
                    this.navigateTo('dashboard');
                },

                // --- CORE: Google Drive Data Management & Roles ---
                async _findOrCreateAppFolder() {
                    if (this.appFolderId) return this.appFolderId;
                    try {
                        // Search for the folder by name
                        let res = await gapi.client.drive.files.list({ 
                            q: `name='${this.APP_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`, 
                            spaces: 'drive', 
                            fields: 'files(id)' 
                        });

                        if (res.result.files && res.result.files.length > 0) {
                            this.appFolderId = res.result.files[0].id;
                        } else {
                            // Create the folder if it doesn't exist
                            let folder = { 'name': this.APP_FOLDER_NAME, 'mimeType': 'application/vnd.google-apps.folder' };
                            res = await gapi.client.drive.files.create({ 
                                resource: folder, 
                                fields: 'id' 
                            });
                            this.appFolderId = res.result.id;
                        }
                        return this.appFolderId;
                    } catch (e) { 
                        console.error('Error finding/creating app folder:', e); 
                        this.showToast('Could not access Drive folder.', 'error'); 
                        throw e; // Propagate error
                    }
                },

                async loadData() {
                    this.showToast("Loading data from Google Drive...", "info");
                    try {
                        // Try to find the MASTER data file
                        const response = await gapi.client.drive.files.list({ 
                            q: `name='${this.DATA_FILE_NAME}' and trashed=false`, 
                            spaces: 'drive', 
                            fields: 'files(id, name, capabilities)' // Request capabilities to determine user role
                        });

                        if (response.result.files && response.result.files.length > 0) {
                            const file = response.result.files[0];
                            this.driveFileId = file.id;
                            // Determine user role based on file edit capabilities
                            this.userRole = file.capabilities.canEdit ? 'owner' : 'viewer'; 
                            
                            // Fetch file content
                            const fileContentResponse = await gapi.client.drive.files.get({ 
                                fileId: this.driveFileId, 
                                alt: 'media' 
                            });
                            const loadedState = JSON.parse(fileContentResponse.body);
                            
                            // Merge loaded state with default to ensure all properties exist
                            const defaultState = { rooms: [], tenants: [], leftTenants: [], dues: [], payments: [], utilityReadings: [], settings: { electricityRate: 8.00, currencySymbol: '₹' } };
                            this.state = { ...defaultState, ...loadedState };
                            this.state.settings = { ...defaultState.settings, ...(loadedState.settings || {}) }; // Ensure settings are merged with defaults
                            
                            this.showToast(`Data loaded. (${this.userRole} mode)`, "success");
                        } else {
                            // No data file found, assume user is owner and will create it
                            this.userRole = 'owner';
                            this.showToast("No data file found. Starting fresh. (Owner mode)", "info");
                            await this._findOrCreateAppFolder(); // Ensure folder exists for new data file
                        }
                    } catch (e) { 
                        console.error("Error loading data:", e); 
                        this.showToast("Failed to load data. You may not have permission, or file is corrupted.", "error"); 
                        if (!this.userRole) this.userRole = 'viewer'; // Fallback to viewer mode if error
                    }
                },

                isOwner() { return this.userRole === 'owner'; },

                // Auto-save mechanism: debounces saves by 2 seconds
                triggerAutoSave() {
                    if (!this.isOwner()) return;
                    clearTimeout(this.saveTimeout);
                    const syncStatusSpan = document.getElementById('sync-status');
                    if (syncStatusSpan) syncStatusSpan.textContent = 'Changes detected...';
                    this.saveTimeout = setTimeout(() => this.saveData(), 2000);
                },
                
                // --- Optimized Saving Technique ---
                async _performFileUpload(fileName, content, fileId = null, parentFolderId = null) {
                    const boundary = '-------314159265358979323846';
                    const delimiter = "\r\n--" + boundary + "\r\n";
                    const close_delim = "\r\n--" + boundary + "--";
                    
                    let request;
                    const metadata = { 'name': fileName, 'mimeType': 'application/json' };

                    if (fileId) {
                        // For UPDATING an existing file: Use 'media' upload type for direct content update.
                        request = gapi.client.drive.files.update({
                            fileId: fileId,
                            uploadType: 'media',
                            media: {
                                mimeType: 'application/json',
                                body: content
                            }
                        });
                    } else {
                        // For CREATING a new file: Use 'multipart' upload type to include both metadata and content.
                        if (parentFolderId) metadata.parents = [parentFolderId];
                        const multipartRequestBody = delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) + delimiter + 'Content-Type: application/json\r\n\r\n' + content + close_delim;
                        request = gapi.client.request({
                            'path': 'https://www.googleapis.com/upload/drive/v3/files',
                            'method': 'POST',
                            'params': { 'uploadType': 'multipart' },
                            'headers': { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
                            'body': multipartRequestBody
                        });
                    }
                    const response = await request;
                    return response.result.id;
                },

                async _findFileByNameInFolder(fileName, folderId) {
                    try {
                        const response = await gapi.client.drive.files.list({
                            q: `name='${fileName}' and '${folderId}' in parents and trashed=false`,
                            spaces: 'drive',
                            fields: 'files(id)'
                        });
                        if (response.result.files && response.result.files.length > 0) {
                            return response.result.files[0].id; // Return the ID if found
                        }
                        return null; // Return null if not found
                    } catch (e) {
                        console.error(`Error finding file by name: ${fileName} in folder ${folderId}`, e);
                        this.showToast(`Error accessing Drive to find ${fileName}.`, 'error');
                        throw e;
                    }
                },

                async saveData() {
                    if (!this.isOwner() || this.isSaving) return;
                    this.isSaving = true;
                    
                    const manualSaveBtn = document.getElementById('manual-save-btn');
                    const syncStatusSpan = document.getElementById('sync-status');
                    
                    let originalBtnText = '';
                    if (manualSaveBtn) {
                        originalBtnText = manualSaveBtn.textContent;
                        manualSaveBtn.disabled = true;
                        manualSaveBtn.textContent = 'Syncing...';
                    }
                    if (syncStatusSpan) syncStatusSpan.textContent = 'Syncing...';
                    
                    // Removed: this.showToast("Saving data to Google Drive...", "info"); // Only show success/error after completion

                    try {
                        if (!this.appFolderId) await this._findOrCreateAppFolder();

                        const dataToSave = JSON.stringify(this.state, null, 2);

                        // --- 1. Save the main data file ---
                        const mainSavePromise = this._performFileUpload(this.DATA_FILE_NAME, dataToSave, this.driveFileId, this.appFolderId)
                            .then(fileId => {
                                if (!this.driveFileId) { 
                                    this.driveFileId = fileId; 
                                    this.userRole = 'owner';
                                }
                            });

                        // --- 2. Save the monthly record file ---
                        const now = new Date();
                        const monthName = now.toLocaleString('default', { month: 'long' });
                        const year = now.getFullYear();
                        const monthlyFileName = this.MONTHLY_FILENAME_TEMPLATE(monthName, year);
                        
                        const monthlyFileId = await this._findFileByNameInFolder(monthlyFileName, this.appFolderId);
                        const monthlySavePromise = this._performFileUpload(monthlyFileName, dataToSave, monthlyFileId, this.appFolderId);
                        
                        // --- Execute both save operations in parallel ---
                        await Promise.all([mainSavePromise, monthlySavePromise]);

                        this.showToast('Data & monthly record saved successfully!', 'success');
                        if (syncStatusSpan) syncStatusSpan.textContent = 'Synced!';
                        setTimeout(() => { if (syncStatusSpan && syncStatusSpan.textContent === 'Synced!') syncStatusSpan.textContent = ''; }, 3000); // Clear after a few seconds

                    } catch (e) {
                        console.error("Error saving data:", e);
                        this.showToast("An error occurred during save. See console.", "error");
                        if (syncStatusSpan) syncStatusSpan.textContent = 'Sync failed!';
                    } finally {
                        this.isSaving = false;
                        if (manualSaveBtn) {
                            manualSaveBtn.disabled = false;
                            manualSaveBtn.textContent = originalBtnText;
                        }
                    }
                },

                async uploadPhotoToDrive(file) {
                    if (!file || file.size === 0) return ''; // No file selected

                    if (!this.appFolderId) {
                        await this._findOrCreateAppFolder(); // Ensure app folder exists
                    }

                    const boundary = '-------314159265358979323846';
                    const delimiter = "\r\n--" + boundary + "\r\n";
                    const close_delim = "\r\n--" + boundary + "--";

                    const metadata = {
                        'name': `app_photo_${Date.now()}_${file.name}`,
                        'mimeType': file.type,
                        'parents': [this.appFolderId],
                    };

                    const reader = new FileReader();
                    return new Promise((resolve, reject) => {
                        reader.onload = async (e) => {
                            const base64Data = e.target.result.split(',')[1];
                            const multipartRequestBody =
                                delimiter +
                                'Content-Type: application/json\r\n\r\n' +
                                JSON.stringify(metadata) +
                                delimiter +
                                'Content-Type: ' + file.type + '\r\n' +
                                'Content-Transfer-Encoding: base64\r\n' +
                                '\r\n' +
                                base64Data +
                                close_delim;

                            try {
                                const response = await gapi.client.request({
                                    'path': 'https://www.googleapis.com/upload/drive/v3/files',
                                    'method': 'POST',
                                    'params': { 'uploadType': 'multipart' },
                                    'headers': { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
                                    'body': multipartRequestBody
                                });
                                // webContentLink provides a direct link to the content
                                resolve(response.result.webContentLink); 
                            } catch (error) {
                                console.error("Error uploading photo to Drive:", error);
                                this.showToast("Failed to upload photo.", "error");
                                reject(error);
                            }
                        };
                        reader.onerror = (error) => {
                            reject(error);
                        };
                        reader.readAsDataURL(file); // Read as Base64 for multipart upload
                    });
                },

                // --- UI & Event Handling ---
                navigateTo(v, id=null) { 
                    this.state.currentView=v;
                    this.state.detailViewId=id;
                    this.render(); 
                },
                render() { 
                    const {currentView:v,detailViewId:id}=this.state;
                    const mainContentArea = document.getElementById('main-content-area');
                    const templateKey = v.includes('-') ? v.split('-').map((p,i)=>i>0?p.charAt(0).toUpperCase()+p.slice(1):p).join('') : v;
                    const templateFunction = this.templates[templateKey];
                    
                    if(templateFunction) {
                        mainContentArea.innerHTML = templateFunction.call(this,id);
                    } else {
                        mainContentArea.innerHTML = `<p style="padding:var(--padding-base);">Error: View '${v}' not found.</p>`;
                    }
                    
                    // Update active class for sidebar navigation
                    document.querySelectorAll('.nav-link').forEach(l=>{
                        // For detail views, match against the primary view name (e.g., 'room' for 'room-detail')
                        const linkView = l.dataset.view;
                        const activeViewBase = v.split('-')[0];
                        l.classList.toggle('active', linkView === activeViewBase);
                    });
                },
                addEventListeners() { 
                    document.body.addEventListener('click',e=>{
                        const t=e.target.closest('[data-action]');
                        if(!t)return;
                        e.preventDefault();
                        const{action:a,view:v,id:i,modalType:m,itemType:it}=t.dataset;

                        // Restrict actions for viewers
                        const ownerActions = ['show-modal', 'delete-item', 'mark-tenant-left', 'report-meter-broken', 'install-new-meter', 'manual-save', 'settle-security-deposit', 'adjust-deposit-against-dues', 'confirm-refund']; // Added adjust and confirm for settleSD modal actions
                        if (ownerActions.includes(a) && !this.isOwner()) {
                            this.showToast('Access Denied: You are in viewer mode.', 'error');
                            return;
                        }

                        const A={
                            'navigate':()=>this.navigateTo(v),
                            'navigate-detail':()=>this.navigateTo(v,i),
                            'show-modal':()=>this.showModal(m,i),
                            'close-modal':()=>this.closeModal(),
                            'delete-item':()=>{if(confirm(`Delete this ${it.replace('-',' ')}? This cannot be undone.`))this.deleteItem(it,i);},
                            'mark-tenant-left':()=>{if(confirm('Are you sure this tenant has left? This will move them to the "Left Tenants" record.'))this.markTenantAsLeft(i);},
                            'generate-receipt':()=>this.generateReceipt(i),
                            'report-meter-broken':()=>{if(confirm('Report meter as broken?'))this.reportMeterBroken(i);},
                            'install-new-meter':()=>this.installNewMeter(i),
                            'share-receipt-whatsapp':()=>this.shareReceiptWhatsApp(i),
                            'share-dues-whatsapp':()=>this.shareDuesWhatsApp(i),
                            'manual-save':()=>this.saveData(),
                            'settle-security-deposit': () => this.showModal('settleSecurityDeposit', i)
                        };
                        if(A[a])A[a]();
                    });

                    document.body.addEventListener('submit',e=>{
                        e.preventDefault();
                        if(!this.isOwner()){ // Prevent form submissions for viewers
                            this.showToast('Access Denied: You are in viewer mode.', 'error');
                            return;
                        }
                        const h={
                            'room-form':f=>this.handleRoomSubmit(f),
                            'tenant-form':f=>this.handleTenantSubmit(f),
                            'settings-form':f=>this.handleSettingsSubmit(f),
                            'utility-form':f=>this.handleUtilitySubmit(f),
                            'payment-form':f=>this.handlePaymentSubmit(f),
                            'service-charge-form':f=>this.handleServiceChargeSubmit(f),
                            'edit-room-form':f=>this.handleEditRoomSubmit(f),
                            'edit-tenant-form':f=>this.handleEditTenantSubmit(f),
                            // Settle security deposit form handled by specific button listener in showModal
                        };
                        if(h[e.target.id])h[e.target.id](e.target);
                    });

                    document.body.addEventListener('change',e=>{
                        if(e.target.matches('input[type="file"]')&&e.target.id!=='import-file-input')this.previewPhoto(e); 
                        if(e.target.id === 'dashboard-filter'){ this.state.dashboardFilter = e.target.value; this.render(); }

                },
                
                // --- TEMPLATES (with Role-Based UI & New Features) ---
                templates: {

                        const { dues, payments, tenants, rooms, settings, dashboardFilter } = this.state;

                            const lastMonthDate = new Date(now); lastMonthDate.setMonth(currentMonth - 1);

                            return total + Math.max(0, tdues - tpmts)

                        const tenantsWithDues = (tenants || [])

                        const quickActions = this.isOwner() ? `<button class="action-btn btn-primary" style="width:100%;margin-bottom:1rem;" data-action="show-modal" data-modal-type="addRoom">Add New Room</button><button class="action-btn btn-secondary" style="width:100%;" data-action="show-modal" data-modal-type="addTenant">Add New Tenant</button>` : `<p style="text-align:center;color:var(--text-light);padding:1rem;"><i>View-only mode. No quick actions available.</i></p>`;

                                <div class="metric-box"><h3>Occupancy</h3><div class="metric-value">${o}%</div></div>
                                <div class="metric-box"><h3>Unverified Tenants</h3><div class="metric-value">${u.length}</div></div>

                async handleRoomSubmit(f) { 
                    const d=new FormData(f);
                    const photoFile = d.get('photo');

                    this.state.rooms.push({
                        id:`room_${Date.now()}`,
                        number:d.get('number'),
                        rent:parseFloat(d.get('rent')),
                        status:'available',
                        tenantId:null,
                        photo: photoUrl, // Store URL
                        meterStatus:'ok',
                        meterInstallationId:`m_${Date.now()}`
                    });
                    this.triggerAutoSave();this.closeModal();this.render();this.showToast('Room added!');
                },
                async handleTenantSubmit(f) { 
                    const d=new FormData(f);
                    const rId=d.get('roomId');
                    if(!rId){this.showToast('Please select a room.','error');return;}
                    
                    const nT={
                        id:`tenant_${Date.now()}`,
                        name:d.get('name'),
                        phone:d.get('phone'),
                        moveInDate:d.get('moveInDate'),
                        isVerified:d.get('isVerified')==='on',
                        roomId:rId,
                        initialSecurityDeposit: parseFloat(d.get('initialSecurityDeposit') || '0') // Store initial SD
                    };
                    this.state.tenants.push(nT);

                    // Record initial security deposit as a payment
                    if (nT.initialSecurityDeposit > 0) {
                        this.state.payments.push({
                            id: `pay_sd_${Date.now()}`,
                            tenantId: nT.id,
                            amount: nT.initialSecurityDeposit,
                            date: new Date().toISOString(),
                            category: 'Security Deposit (Paid)',
                            description: 'Initial Security Deposit Received'
                        });
                    }

                    const r=this.state.rooms.find(rm=>rm.id===rId);
                    if(r){r.status='occupied';r.tenantId=nT.id;}
                    this.triggerAutoSave();this.closeModal();this.navigateTo('tenants');this.showToast('Tenant added!');
                },
                handleSettingsSubmit(f) {
                    this.state.settings.electricityRate=parseFloat(f.querySelector('#electricity-rate').value);
                    this.state.settings.currencySymbol=f.querySelector('#currency-symbol').value;
                    this.triggerAutoSave();this.render();this.showToast('Settings saved!');
                },
                handleUtilitySubmit(f) { 
                    const rId=f.dataset.roomId,r=this.state.rooms.find(rm=>rm.id===rId);
                    const nR=parseFloat(f.querySelector('#meter-reading').value); // Parse as float
                    const lR=(this.state.utilityReadings||[]).filter(ur=>ur.meterInstallationId===r.meterInstallationId).sort((a,b)=>b.reading-a.reading)[0]?.reading||0;
                    if(nR<=lR){this.showToast('New reading must be greater than the last reading.','error');return;}
                    const c=nR-lR,b=c*this.state.settings.electricityRate;
                    this.state.utilityReadings.push({id:`ur_${Date.now()}`,roomId:rId,date:new Date().toISOString(),reading:nR,meterInstallationId:r.meterInstallationId});
                    if(r?.tenantId)this.state.dues.push({id:`due_${Date.now()}`,tenantId:r.tenantId,amount:parseFloat(b.toFixed(2)),date:new Date().toISOString(),type:'utility',description:`Electricity Bill (${c} units)`});

                async handleEditTenantSubmit(f) { 
                    const id=f.dataset.id,t=this.state.tenants.find(tn=>tn.id===id);
                    if(!t)return;
                    const d=new FormData(f),oRId=t.roomId,nRId=d.get('roomId');

                    t.initialSecurityDeposit = parseFloat(d.get('initialSecurityDeposit') || '0'); // Update initial SD, but actual balance is from payments
                    if(oRId!==nRId){
                        const oR=this.state.rooms.find(r=>r.id===oRId);if(oR){oR.status='available';oR.tenantId=null;}
                        const nR=this.state.rooms.find(r=>r.id===nRId);if(nR){nR.status='occupied';nR.tenantId=id;}
                    }
                    this.triggerAutoSave();this.closeModal();this.render();this.showToast('Tenant details updated!');
                },
                async handleSettleSecurityDeposit(form, tenantId, type, amount, currentDuesBalance = 0) {
                    if (!this.isOwner()) {
                        this.showToast('Access Denied: You are in viewer mode.', 'error');
                        return;
                    }
                    const tenantPayments = (this.state.payments || []).filter(p => p.tenantId === tenantId);
                    const sdPaid = tenantPayments.filter(pm => pm.category === 'Security Deposit (Paid)').reduce((s, pm) => s + pm.amount, 0);
                    const sdRefunded = tenantPayments.filter(pm => pm.category === 'Security Deposit (Refunded)').reduce((s, pm) => s + pm.amount, 0);
                    const sdAdjusted = tenantPayments.filter(pm => pm.category === 'Security Deposit (Adjusted)').reduce((s, pm) => s + pm.amount, 0);
                    const currentSDBalance = sdPaid - sdRefunded - sdAdjusted;

                    if (type === 'refund') {
                        const refundAmount = amount; // amount is directly the refund value here
                        if (refundAmount <= 0) { // Allow 0 refund, but warn if negative
                            this.showToast('Invalid refund amount. Must be a positive number.', 'error');
                            return;
                        }
                        if (refundAmount > currentSDBalance) {
                            this.showToast('Refund amount cannot exceed current security deposit balance.', 'error');
                            return;
                        }
                        this.state.payments.push({
                            id: `pay_sd_refund_${Date.now()}`,
                            tenantId: tenantId,
                            amount: refundAmount,
                            date: new Date().toISOString(),
                            category: 'Security Deposit (Refunded)',
                            description: `Security Deposit Refund (${refundAmount.toLocaleString('en-IN')} refunded)`
                        });
                        this.showToast(`Refunded ${this.state.settings.currencySymbol}${refundAmount.toLocaleString('en-IN')}.`, 'success');

                    } else if (type === 'adjust') {
                        const amountToAdjust = Math.min(currentSDBalance, Math.max(0, currentDuesBalance));
                        if (amountToAdjust <= 0) {
                            this.showToast('No outstanding dues or insufficient security deposit to adjust.', 'warning');
                            this.closeModal(); // Close if no adjustment needed
                            return;
                        }
                        this.state.payments.push({
                            id: `pay_sd_adjust_${Date.now()}`,
                            tenantId: tenantId,
                            amount: amountToAdjust,
                            date: new Date().toISOString(),
                            category: 'Security Deposit (Adjusted)',
                            description: `Security Deposit Adjusted Against Dues (${amountToAdjust.toLocaleString('en-IN')} adjusted)`
                        });
                        this.showToast(`Adjusted ${this.state.settings.currencySymbol}${amountToAdjust.toLocaleString('en-IN')} from security deposit against dues.`, 'success');
                    }

                    this.triggerAutoSave();
                    this.closeModal();
                    this.render(); // Re-render tenant detail to show updated balance
                },
                deleteItem(t, id) { 
                    if (!this.isOwner()) {
                        this.showToast('Access Denied: You are in viewer mode.', 'error');
                        return;
                    }
                    if(t==='room'){
                        if((this.state.rooms||[]).find(r=>r.id===id)?.status==='occupied'){
                            this.showToast('Cannot delete occupied room. First, mark the tenant as left.','error');return;
                        }
                        this.state.rooms=(this.state.rooms||[]).filter(r=>r.id!==id);
                        this.navigateTo('rooms');
                    }
                    // No direct tenant delete, only mark as left.
                    this.triggerAutoSave();this.showToast(`${t.replace('-',' ')} deleted.`,'success');
                },
                markTenantAsLeft(tenantId) { 
                    if (!this.isOwner()) {
                        this.showToast('Access Denied: You are in viewer mode.', 'error');
                        return;
                    }
                    const tenantIndex = this.state.tenants.findIndex(t => t.id === tenantId); 
                    if (tenantIndex === -1) {
                        this.showToast("Tenant not found.", "error");
                        return;
                    }
                    const tenant = this.state.tenants[tenantIndex]; 
                    tenant.leaveDate = new Date().toISOString(); 
                    const room = this.state.rooms.find(r => r.id === tenant.roomId); 
                    if (room) { room.status = 'available'; room.tenantId = null; } 
                    if (!this.state.leftTenants) this.state.leftTenants = []; 
                    this.state.leftTenants.push(tenant); 
                    this.state.tenants.splice(tenantIndex, 1); 
                    this.triggerAutoSave(); 
                    this.navigateTo('leftTenants'); 
                    this.showToast(`${tenant.name}'s record moved to Left Tenants.`, 'success');
                },
                reportMeterBroken(rId) { 
                    if (!this.isOwner()) {
                        this.showToast('Access Denied: You are in viewer mode.', 'error');
                        return;
                    }
                    const r=this.state.rooms.find(rm=>rm.id===rId);
                    if(r){
                        r.meterStatus='broken';
                        this.triggerAutoSave();
                        this.render();
                        this.showToast('Meter reported as broken.','warning');
                    } else {
                        this.showToast('Room not found.','error');
                    }
                },
                installNewMeter(rId) {
                    if (!this.isOwner()) {
                        this.showToast('Access Denied: You are in viewer mode.', 'error');
                        return;
                    }
                    const initialReadingStr = prompt("Enter initial reading of the new meter (e.g., 0):");
                    if (initialReadingStr === null) return; // User cancelled
                    const i = parseFloat(initialReadingStr); // Parse as float
                    if(isNaN(i)||i<0) {
                        this.showToast('Invalid reading. Please enter a non-negative number.','error');
                        return;
                    }
                    const r=this.state.rooms.find(rm=>rm.id===rId);
                    if(r){
                        r.meterStatus='ok';
                        r.meterInstallationId=`m_${Date.now()}`;
                        this.state.utilityReadings.push({id:`ur_${Date.now()}`,roomId:rId,date:new Date().toISOString(),reading:i,meterInstallationId:r.meterInstallationId});
                        this.triggerAutoSave();
                        this.render();
                        this.showToast('New meter installed!');
                    } else {
                        this.showToast('Room not found.','error');
                    }
                },
                generateMissingRentDues() { 
                    let c=0;const t=new Date();t.setHours(0,0,0,0);
                    (this.state.tenants||[]).forEach(tn=>{
                        const r=(this.state.rooms||[]).find(rm=>rm.id===tn.roomId);
                        if(!r||!tn.moveInDate)return;
                        
                        let moveInDate = new Date(tn.moveInDate);
                        // Set the move-in date to the 1st of the month
                        moveInDate.setDate(1); 
                        moveInDate.setHours(0,0,0,0);

                        // Start checking from the month *after* move-in.
                        // If move-in is Jan 15, first rent due is Feb 1.
                        // If move-in is Jan 1, first rent due is Feb 1.
                        let dueDate = new Date(moveInDate);
                        dueDate.setMonth(dueDate.getMonth() + 1); // Move to the first of the next month

                        while(dueDate <= t){
                            const dY=dueDate.getFullYear(),dM=dueDate.getMonth();
                            const alreadyExists = (this.state.dues || []).some(due => 
                                due.tenantId === tn.id && 
                                due.type === 'rent' && 
                                new Date(due.date).getFullYear() === dY && 
                                new Date(due.date).getMonth() === dM
                            );
                            if(!alreadyExists){
                                this.state.dues.push({
                                    id:`due_${dueDate.getTime()}_${tn.id}`,
                                    tenantId:tn.id,
                                    amount:r.rent,
                                    date:dueDate.toISOString(),
                                    type:'rent',
                                    description:`Monthly Rent for ${dueDate.toLocaleString('default', { month: 'long', year: 'numeric' })}`
                                });
                                c++;
                            }
                            dueDate.setMonth(dueDate.getMonth()+1); // Move to next month
                        }
                    });
                    return c;
                },
                generateReceipt(pId){
                    const p=this.state.payments.find(pm=>pm.id===pId);
                    if(!p){this.showToast("Payment not found for receipt.", "error"); return;}
                    const t=this.state.tenants.find(tn=>tn.id===p.tenantId)||this.state.leftTenants.find(tn=>tn.id===p.tenantId);
                    if(!t){this.showToast("Tenant not found for receipt.", "error"); return;}
                    
                    const w=window.open('','_blank');
                    w.document.write(`<!DOCTYPE html>
                        <html>
                        <head>
                            <title>भुगतान रसीद / Payment Receipt</title>
                            <style>
                                body { font-family: 'Inter', sans-serif; padding: 2rem; color: #333; line-height: 1.8; max-width: 600px; margin: auto; border: 1px solid #eee; box-shadow: 0 0 10px rgba(0,0,0,0.05); border-radius: 8px; }
                                h1 { text-align: center; color: #4CAF50; margin-bottom: 1.5rem; font-size: 2.2rem; }
                                hr { border: none; border-top: 1px dashed #ddd; margin: 1.5rem 0; }
                                p { margin-bottom: 0.8rem; font-size: 1.1rem; display: flex; justify-content: space-between; }
                                p strong { color: #333; }
                                .header-info { text-align: center; margin-bottom: 2rem; }
                                .header-info h2 { font-size: 1.8rem; color: #388E3C; margin-bottom: 0.5rem; }
                                .header-info p { font-size: 1rem; color: #666; margin: 0; }
                                .footer { text-align: center; margin-top: 3rem; font-size: 0.9rem; color: #666; }
                            </style>
                        </head>
                        <body>
                            <div class="header-info">
                                <h2>TenantFlow Management</h2>
                                <p>Your Property Management Solution</p>
                            </div>
                            <h1>भुगतान रसीद / Payment Receipt</h1>
                            <hr>
                            <p><span><strong>रसीद संख्या / Receipt No.:</strong></span> <span>${p.id}</span></p>
                            <p><span><strong>प्राप्तकर्ता का नाम / Recipient Name:</strong></span> <span>${t.name}</span></p>
                            <p><span><strong>दिनांक / Date:</strong></span> <span>${new Date(p.date).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}</span></p>
                            <p><span><strong>राशि / Amount:</strong></span> <span>${this.state.settings.currencySymbol}${p.amount.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></p>
                            <p><span><strong>के लिए / For:</strong></span> <span>${p.description||p.category}</span></p>
                            <hr>
                            <div class="footer">
                                <p>धन्यवाद! / Thank You!</p>
                                <p>This is an electronically generated receipt and does not require a signature.</p>
                            </div>
                        </body>
                        </html>`);
                    w.document.close();
                    w.print();
                },
                shareReceiptWhatsApp(pId) { 
                    const p=this.state.payments.find(pm=>pm.id===pId);if(!p)return;
                    const t=this.state.tenants.find(tn=>tn.id===p.tenantId)||this.state.leftTenants.find(tn=>tn.id===p.tenantId);
                    if(!t||!t.phone){this.showToast('Tenant phone number not found.','error');return;}
                    const{currencySymbol:cS}=this.state.settings;
                    const m=`*Payment Confirmation*\n\nHi ${t.name},\n\nWe have received your payment.\n\n*Details:*\nAmount: ${cS}${p.amount.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}\nDate: ${new Date(p.date).toLocaleDateString()}\nFor: ${p.description||p.category}\n\nThank you.`;
                    this.openWhatsApp(t.phone,m);
                },
                shareDuesWhatsApp(tenantId){
                    const t=this.state.tenants.find(tn=>tn.id===tenantId);
                    if(!t||!t.phone){this.showToast('किरायेदार का फ़ोन नंबर नहीं मिला। कृपया जांचें।','error');return;}
                    const{currencySymbol:cS,electricityRate:eR}=this.state.settings;
                    
                    // Exclude security deposit movements from standard dues calculation
                    const allDues=(this.state.dues||[]).filter(d=>d.tenantId===tenantId);
                    const allPayments=(this.state.payments||[]).filter(p=>p.tenantId===tenantId && !['Security Deposit (Paid)', 'Security Deposit (Refunded)', 'Security Deposit (Adjusted)'].includes(p.category));
                    
                    const totalDueAmount=allDues.reduce((s,d)=>s+d.amount,0);
                    const totalPaidAmount=allPayments.reduce((s,p)=>s+p.amount,0);
                    const balance=totalDueAmount-totalPaidAmount;
                    
                    if(balance<=0){this.showToast('कोई लंबित बकाया राशि नहीं है।','success');return;}
                    
                    const hindiDueItems=[];
                    allDues.forEach(d=>{
                        let itemString='';
                        const amountFormatted=`${cS}${d.amount.toLocaleString('hi-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                        
                        // Calculate paid amount specifically for this due item
                        let paidForThisDue = 0;
                        if (d.type === 'rent') {
                            paidForThisDue = allPayments.filter(p => p.category === 'Rent' && 
                                new Date(p.date).getFullYear() === new Date(d.date).getFullYear() && 
                                new Date(p.date).getMonth() === new Date(d.date).getMonth() &&
                                d.description.includes(new Date(p.date).toLocaleString('default', { month: 'long', year: 'numeric' })) // More specific check for month
                            ).reduce((s, p) => s + p.amount, 0);
                        } else if (d.type === 'utility') {
                            paidForThisDue = allPayments.filter(p => p.category === 'Electricity' && 
                                p.description === d.description && // Match description for utility to ensure specific bill
                                new Date(p.date).getFullYear() === new Date(d.date).getFullYear() && 
                                new Date(p.date).getMonth() === new Date(d.date).getMonth()
                            ).reduce((s, p) => s + p.amount, 0);
                        } else if (d.type === 'service') {
                            paidForThisDue = allPayments.filter(p => p.category === 'Other' && p.description === d.description).reduce((s, p) => s + p.amount, 0);
                        }

                        if (paidForThisDue < d.amount) { // Only list if still pending
                            const remainingDue = d.amount - paidForThisDue;
                            const remainingDueFormatted = `${cS}${remainingDue.toLocaleString('hi-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                            if(d.type==='rent'){
                                itemString=`* किराया (${new Date(d.date).toLocaleString('hi-IN', { month: 'long', year: 'numeric' })}): ${remainingDueFormatted}`;
                            } else if(d.type==='utility'){
                                const unitsMatch=d.description.match(/(\d+(\.\d+)?)\s*units/),units=unitsMatch?unitsMatch[1]:'N/A';
                                itemString=`* बिजली (${new Date(d.date).toLocaleDateString('hi-IN')} - ${units} यूनिट @ ${cS}${eR}/यूनिट): ${remainingDueFormatted}`;
                            } else if(d.type==='service'){
                                itemString=`* ${d.description} (${new Date(d.date).toLocaleDateString('hi-IN')}): ${remainingDueFormatted}`;
                            }
                            hindiDueItems.push(itemString);
                        }
                    });
                    
                    const duesListString=hindiDueItems.join('\n');
                    const paymentPhoneNumber='7078098123'; // Replace with your actual payment number
                    const finalWhatsAppMessage=`नमस्ते ${t.name},\n\nयह आपके लंबित बकाया शुल्कों का विवरण है:\n\n${duesListString}\n\n*कुल देय राशि: ${cS}${balance.toLocaleString('hi-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n\nकृपया जल्द से जल्द शेष राशि का भुगतान करें। आप इस नंबर पर भुगतान कर सकते हैं: *${paymentPhoneNumber}*\n\nभुगतान के बाद, कृपया हमें *स्क्रीनशॉट* भेजना न भूलें।\n\nधन्यवाद।`;
                    this.openWhatsApp(t.phone,finalWhatsAppMessage);
                },
                openWhatsApp(phone, message) { 
                    const cP=phone.replace(/\D/g,'');
                    const fP=cP.startsWith('91')?cP:'91'+cP; // Ensure Indian country code
                    const u=`https://wa.me/${fP}?text=${encodeURIComponent(message)}`;
                    window.open(u,'_blank');
                },
                showToast(msg, type='success') {
                    const t=document.getElementById('toast');
                    if (!t) return;
                    t.textContent=msg;
                    t.className=`show ${type}`;
                    setTimeout(()=>t.className=t.className.replace('show',''),3000);
                },
                previewPhoto(e) {
                    const p=document.getElementById('photo-preview');
                    if(!p)return;
                    const f=e.target.files[0];
                    if(f){
                        const r=new FileReader();
                        r.onload=ev=>{
                            p.src=ev.target.result;
                            p.style.display='block';
                        };
                        r.readAsDataURL(f);
                    } else {
                        p.src = '';
                        p.style.display = 'none';
                    }
                },
            };

            app.init();
        })();
    </script>
</body>
