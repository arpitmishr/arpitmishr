<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant & Rent Management System</title>
    <!-- --- NEW: Favicon Added --- -->
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3e%3crect width='100' height='100' rx='15' fill='%236366f1'/%3e%3ctext x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle'%3eTR%3c/text%3e%3c/svg%3e">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1; --primary-hover: #4f46e5; --secondary-color: #10b981;
            --danger-color: #ef4444; --warning-color: #f59e0b; --bg-color: #f3f4f6;
            --text-color: #1f2937; --text-light: #6b7280; --card-bg: #ffffff;
            --border-color: #e5e7eb; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --whatsapp-color: #25D366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color);
            display: flex; height: 100vh;
            overflow: hidden; /* This is good for desktop layout, but needs to be changed for mobile */
        }
        .sidebar { width: 260px; background-color: var(--card-bg); padding: 1.5rem; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 2rem; }
        .logo { font-size: 1.8rem; font-weight: 700; color: var(--primary-color); margin-bottom: 2.5rem; text-align: center; }
        .nav-menu a { display: flex; align-items: center; padding: 0.9rem 1.5rem; margin-bottom: 0.5rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; transition: background-color 0.2s, color 0.2s; cursor: pointer; }
        .nav-menu a:hover { background-color: #f3f4f6; color: var(--primary-color); }
        .nav-menu a.active { background-color: var(--primary-color); color: white; box-shadow: var(--shadow); }
        .view { display: none; } .view.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .section-header .header-actions { display: flex; gap: 1rem; }
        .section-title { font-size: 1.8rem; font-weight: 600; }
        .action-btn { padding: 0.7rem 1.2rem; font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; color: white; display: inline-flex; align-items: center; gap: 0.5rem; }
        .action-btn:hover { transform: translateY(-2px); }
        .btn-primary { background-color: var(--primary-color); } .btn-primary:hover { box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .btn-secondary { background-color: var(--secondary-color); } .btn-secondary:hover { box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        .btn-danger { background-color: var(--danger-color); } .btn-warning { background-color: var(--warning-color); }
        .btn-cancel { background-color: #e5e7eb; color: #374151; }
        .btn-whatsapp { background-color: var(--whatsapp-color); }
        .btn-whatsapp:hover { box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); }
        .transaction-actions { display: flex; gap: 0.5rem; align-items: center; }
        .btn-icon { padding: 0.4rem; line-height: 0; }
        .btn-icon svg { width: 1.2em; height: 1.2em; fill: white; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .data-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .data-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card-photo { width: 100%; height: 180px; background-color: var(--border-color); background-size: cover; background-position: center; position: relative; }
        .card-status { position: absolute; top: 1rem; right: 1rem; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; text-transform: capitalize; backdrop-filter: blur(5px); background-color: rgba(255,255,255,0.7); }
        .status-available { color: #065f46; } .status-occupied { color: #991b1b; }
        .card-content { padding: 1.5rem; flex-grow: 1; } .card-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; } .card-info { color: var(--text-light); font-size: 0.9rem; }
        .metric-boxes { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 2rem; }
        .metric-box { padding: 1.5rem; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); }
        .metric-box h3 { color: var(--text-light); margin-bottom: 1rem; font-size: 1rem; font-weight: 500; } .metric-value { font-size: 2.5rem; font-weight: 700; }
        .dashboard-section { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow); }
        .dashboard-section h3 { font-size: 1.2rem; margin-bottom: 1rem; }
        .alert-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; }
        .alert-item.danger { background-color: #fee2e2; color: #b91c1c; } .alert-item.warning { background-color: #fef3c7; color: #92400e; } .alert-item:hover { opacity: 0.8; }
        .detail-view-header { display: flex; gap: 2rem; margin-bottom: 2rem; align-items: flex-start; }
        .detail-photo { width: 150px; height: 150px; flex-shrink: 0; border-radius: 12px; background-size: cover; background-position: center; background-color: var(--border-color); box-shadow: var(--shadow); }
        .detail-info h2 { font-size: 2rem; margin-bottom: 0.5rem; } .detail-info p { color: var(--text-light); margin-bottom: 0.2rem; }
        .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .detail-main, .detail-sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
        .detail-card { background-color: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow); }
        .detail-card h4 { font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .detail-card ul { list-style: none; padding-left: 0; } .detail-card li { display: flex; justify-content: space-between; padding: 0.5rem 0; }
        .transaction-item { display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding: 0.8rem 0;}
        .transaction-item:last-child { border-bottom: none; }
        .transaction-item.due { color: var(--danger-color); } .transaction-item.payment { color: var(--secondary-color); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: flex-start; justify-content: center; padding-top: 5vh; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background-color: white; padding: 2rem; width: 90%; max-width: 600px; border-radius: 12px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { font-size: 1.5rem; }
        .close-btn { font-size: 2rem; cursor: pointer; background: none; border: none; color: var(--text-light); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        .form-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; }
        #photo-preview { max-width: 100px; max-height: 100px; margin-top: 1rem; border-radius: 8px; object-fit: cover; }
        #toast { position: fixed; bottom: -100px; right: 20px; padding: 1rem 2rem; border-radius: 8px; color: white; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: bottom 0.5s ease-in-out; z-index: 9999; }
        #toast.show { bottom: 20px; } #toast.success { background-color: var(--secondary-color); } #toast.error { background-color: var(--danger-color); }
        
        @media (max-width: 1024px) { .detail-grid { grid-template-columns: 1fr; } }
        
        /* --- MODIFIED: Mobile Responsiveness and Scrolling Fix --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100%; /* Allow body to grow */
                overflow: auto; /* Enable native scrolling on the whole page */
            }
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                z-index: 100;
                box-shadow: var(--shadow);
            }
            .main-content {
                overflow-y: visible; /* Disable scrolling on this container, let body handle it */
                padding: 1.5rem;
            }
            .logo { margin-bottom: 0; }
            .nav-menu {
                display: flex;
                gap: 0.5rem;
            }
            .nav-menu a { padding: 0.5rem; }
            .nav-menu span { display: none; }
            .detail-view-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .section-header, .section-header .header-actions {
                justify-content: center; /* Center buttons on mobile */
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">Mishra Ji</h1>
        <nav class="nav-menu">
            <a data-action="navigate" data-view="dashboard" class="nav-link"><span>Dashboard</span></a>
            <a data-action="navigate" data-view="rooms" class="nav-link"><span>Rooms</span></a>
            <a data-action="navigate" data-view="tenants" class="nav-link"><span>Tenants</span></a>
            <a data-action="navigate" data-view="settings" class="nav-link"><span>Settings</span></a>
        </nav>
    </aside>
    <main class="main-content" id="main-content-area"></main>
    <div id="modal-container"></div>
    <div id="toast"></div>

    <script>
    // The JavaScript remains the same as the previous version.
    // All changes for this request were in HTML and CSS.
    document.addEventListener('DOMContentLoaded', () => {
        const app = {
            state: {
                rooms: [], tenants: [], dues: [], payments: [], utilityReadings: [],
                settings: { electricityRate: 8.00, currencySymbol: '₹' },
                currentView: 'dashboard', detailViewId: null
            },
            
            init() { this.loadData(); const c=this.generateMissingRentDues();if(c>0){this.saveData();this.showToast(`${c} new rent due(s) generated.`);}this.addEventListeners();this.navigateTo('dashboard'); },
            loadData() { const d=localStorage.getItem('trms_data');if(d){const lS=JSON.parse(d);this.state={...this.state,...lS};this.state.settings={...this.state.settings,...lS.settings};}},
            saveData() { localStorage.setItem('trms_data', JSON.stringify(this.state)); },
            navigateTo(v, id=null) { this.state.currentView=v;this.state.detailViewId=id;this.render(); },
            render() { const{currentView:v,detailViewId:id}=this.state;const m=document.getElementById('main-content-area');const k=v.includes('-')?v.split('-').map((p,i)=>i>0?p.charAt(0).toUpperCase()+p.slice(1):p).join(''):v;const f=this.templates[k];if(f)m.innerHTML=f.call(this,id);else m.innerHTML=`<p>Error: View '${v}' not found.</p>`;document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.view===v.split('-')[0]));},
            addEventListeners() { document.body.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;e.preventDefault();const{action:a,view:v,id:i,modalType:m,itemType:it}=t.dataset;const A={'navigate':()=>this.navigateTo(v),'navigate-detail':()=>this.navigateTo(v,i),'show-modal':()=>this.showModal(m,i),'close-modal':()=>this.closeModal(),'delete-item':()=>{if(confirm(`Delete this ${it.replace('-',' ')}? This cannot be undone.`))this.deleteItem(it,i);},'generate-receipt':()=>this.generateReceipt(i),'generate-statement':()=>this.generateMonthlyStatement(i),'report-meter-broken':()=>{if(confirm('Report meter as broken?'))this.reportMeterBroken(i);},'install-new-meter':()=>this.installNewMeter(i),'export-data':()=>this.exportData(),'import-data':()=>document.getElementById('import-file-input')?.click(),'share-receipt-whatsapp':()=>this.shareReceiptWhatsApp(i),'share-dues-whatsapp':()=>this.shareDuesWhatsApp(i),};if(A[a])A[a]();});document.body.addEventListener('submit',e=>{e.preventDefault();const h={'room-form':f=>this.handleRoomSubmit(f),'tenant-form':f=>this.handleTenantSubmit(f),'settings-form':f=>this.handleSettingsSubmit(f),'utility-form':f=>this.handleUtilitySubmit(f),'payment-form':f=>this.handlePaymentSubmit(f),'service-charge-form':f=>this.handleServiceChargeSubmit(f),'edit-room-form':f=>this.handleEditRoomSubmit(f),'edit-tenant-form':f=>this.handleEditTenantSubmit(f),};if(h[e.target.id])h[e.target.id](e.target);});document.body.addEventListener('change',e=>{if(e.target.matches('input[type="file"]')&&e.target.id!=='import-file-input')this.previewPhoto(e);if(e.target.matches('#import-file-input'))this.importData(e.target.files[0]);});},
            
            templates: {
                dashboard() { const {dues,payments,tenants,rooms,settings}=this.state;const n=new Date(),m=n.getMonth();const mI=payments.filter(p=>new Date(p.date).getMonth()===m).reduce((s,p)=>s+p.amount,0);const o=rooms.length>0?(tenants.length/rooms.length)*100:0;const tD=tenants.reduce((total,t)=>{const tdues=dues.filter(d=>d.tenantId===t.id).reduce((s,d)=>s+d.amount,0);const tpmts=payments.filter(p=>p.tenantId===t.id).reduce((s,p)=>s+p.amount,0);return total+Math.max(0,tdues-tpmts)},0);const u=tenants.filter(t=>!t.isVerified);let aH=u.map(t=>`<div class="alert-item warning" data-action="navigate-detail" data-view="tenant-detail" data-id="${t.id}">${t.name}'s verification is pending. <span>View →</span></div>`).join('');return `<div id="dashboard" class="view active"><div class="section-header"><h2 class="section-title">Dashboard</h2></div><div class="metric-boxes grid-container"><div class="metric-box"><h3>This Month's Income</h3><div class="metric-value">${settings.currencySymbol}${mI.toLocaleString('en-IN')}</div></div><div class="metric-box"><h3>Total Pending Dues</h3><div class="metric-value">${settings.currencySymbol}${tD.toLocaleString('en-IN')}</div></div><div class="metric-box"><h3>Occupancy</h3><div class="metric-value">${o.toFixed(0)}%</div></div><div class="metric-box"><h3>Unverified Tenants</h3><div class="metric-value">${u.length}</div></div></div><div class="detail-grid" style="margin-top: 2rem;"><div class="dashboard-section"><h3>System Alerts</h3><div id="alert-list">${aH||'<p>No system alerts.</p>'}</div></div><div class="dashboard-section"><h3>Quick Actions</h3><button class="action-btn btn-primary" style="width: 100%; margin-bottom: 1rem;" data-action="show-modal" data-modal-type="addRoom">Add New Room</button><button class="action-btn btn-secondary" style="width: 100%;" data-action="show-modal" data-modal-type="addTenant">Add New Tenant</button></div></div></div>`; },
                rooms() { return `<div class="view active"><div class="section-header"><h2 class="section-title">Rooms</h2><button class="action-btn btn-primary" data-action="show-modal" data-modal-type="addRoom">Add Room</button></div><div class="grid-container">${this.state.rooms.map(r=>`<div class="data-card" data-action="navigate-detail" data-view="room-detail" data-id="${r.id}"><div class="card-photo" style="background-image:url(${r.photo||''})"><span class="card-status status-${r.status}">${r.status}</span></div><div class="card-content"><h3 class="card-title">Room ${r.number}</h3><p class="card-info">Rent: ${this.state.settings.currencySymbol}${r.rent}/month</p><p class="card-info">Tenant: ${this.state.tenants.find(t=>t.id===r.tenantId)?.name||'<i>Vacant</i>'}</p></div></div>`).join('')||'<p>No rooms found.</p>'}</div></div>`;},
                tenants() { return `<div class="view active"><div class="section-header"><h2 class="section-title">Tenants</h2><button class="action-btn btn-secondary" data-action="show-modal" data-modal-type="addTenant">Add Tenant</button></div><div class="grid-container">${this.state.tenants.map(t=>`<div class="data-card" data-action="navigate-detail" data-view="tenant-detail" data-id="${t.id}"><div class="card-photo" style="background-image:url(${t.photo||''})"><span class="card-status" style="color:${t.isVerified?'green':'red'}">${t.isVerified?'Verified':'Not Verified'}</span></div><div class="card-content"><h3 class="card-title">${t.name}</h3><p class="card-info">Room: ${this.state.rooms.find(r=>r.id===t.roomId)?.number||'N/A'}</p><p class="card-info">Phone: ${t.phone}</p></div></div>`).join('')||'<p>No tenants found.</p>'}</div></div>`;},
                settings() { return `<div class="view active"><div class="section-header"><h2 class="section-title">Settings</h2></div><div class="detail-card" style="max-width:500px;"><form id="settings-form"><h4>General Settings</h4><div class="form-group"><label>Electricity Rate (per unit)</label><input type="number" step="0.01" id="electricity-rate" value="${this.state.settings.electricityRate}"></div><div class="form-group"><label>Currency Symbol</label><input type="text" id="currency-symbol" value="${this.state.settings.currencySymbol}"></div><div class="form-actions"><button type="submit" class="action-btn btn-primary">Save Settings</button></div></form></div><div class="detail-card" style="max-width:500px;margin-top:2rem;"><h4>Data Management</h4><p style="margin-bottom:1rem;color:var(--text-light)">Export all system data or import from a backup file.</p><div style="display:flex;gap:1rem;margin-bottom:1.5rem;"><button class="action-btn btn-secondary" data-action="export-data">Export Data</button><button class="action-btn btn-primary" data-action="import-data">Import Data</button><input type="file" id="import-file-input" style="display:none;" accept=".json"></div><hr style="margin:1.5rem 0;border-color:var(--border-color);"><h4>Danger Zone</h4><p style="margin-bottom:1rem;color:var(--text-light)">Permanently delete all data.</p><button class="action-btn btn-danger" data-action="delete-item" data-item-type="all-data">Delete All Data</button></div></div>`;},
                roomDetail(id) { const r = this.state.rooms.find(rm => rm.id === id); if (!r) return `<p>Room not found.</p>`; const t = this.state.tenants.find(tn => tn.id === r.tenantId); const rd = this.state.utilityReadings.filter(ur => ur.roomId === id && ur.meterInstallationId === r.meterInstallationId).sort((a,b) => new Date(b.date) - new Date(a.date)); let m = (r.meterStatus === 'broken') ? `<button class="action-btn btn-warning" data-action="install-new-meter" data-id="${id}">Install New Meter</button>` : `<button class="action-btn btn-danger" data-action="report-meter-broken" data-id="${id}">Report Meter Broken</button>`; return `<div class="view active"><div class="section-header"><div class="header-actions"><button class="action-btn btn-cancel" data-action="navigate" data-view="rooms">← Back</button><button class="action-btn btn-warning" data-action="show-modal" data-modal-type="editRoom" data-id="${id}">Edit Details</button></div><button class="action-btn btn-danger" data-action="delete-item" data-item-type="room" data-id="${id}">Delete Room</button></div><div class="detail-view-header"><div class="detail-photo" style="background-image: url(${r.photo || ''})"></div><div class="detail-info"><h2>Room ${r.number}</h2><p>Status: ${r.status}</p><p>Tenant: ${t ? t.name : 'Vacant'}</p></div></div><div class="detail-grid"><div class="detail-main"><div class="detail-card"><h4>Room Information</h4><ul><li><span>Monthly Rent</span><strong>${this.state.settings.currencySymbol}${r.rent}</strong></li><li><span>Meter Status</span><strong>${r.meterStatus}</strong></li></ul></div><div class="detail-card"><h4>Utility Readings (Current Meter)</h4><div>${rd.map(r => `<div class="payment-history-item"><p><strong>${new Date(r.date).toLocaleDateString()}</strong> - Reading: ${r.reading} units</p></div>`).join('') || '<p>No readings for this meter.</p>'}</div></div></div><div class="detail-sidebar"><div class="detail-card"><h4>Meter Management</h4>${m}</div><div class="detail-card"><h4>Add Utility Reading</h4><form id="utility-form" data-room-id="${id}"><div class="form-group"><label>New Meter Reading</label><input type="number" id="meter-reading" required ${r.meterStatus === 'broken' ? 'disabled' : ''}></div><button type="submit" class="action-btn btn-secondary" style="width:100%" ${r.meterStatus === 'broken' ? 'disabled' : ''}>Generate Bill</button></form></div></div></div></div>`; },

            /**
 * Shares payment receipt via WhatsApp
 * @param {string} paymentId - The ID of the payment to share
 */
shareReceiptWhatsApp(paymentId) {
    // Find the payment record
    const payment = this.state.payments.find(payment => payment.id === paymentId);
    
    if (!payment) {
        console.error('Payment not found');
        return;
    }

    // Find the tenant associated with this payment
    const tenant = this.state.tenants.find(tenant => tenant.id === payment.tenantId);
    
    if (!tenant || !tenant.phone) {
        this.showToast('Tenant phone number not found.', 'error');
        return;
    }

    // Get currency symbol from settings
    const { currencySymbol } = this.state.settings;
    
    // Format the payment date
    const paymentDate = new Date(payment.date).toLocaleDateString();
    
    // Create payment confirmation message
    const receiptMessage = `*Payment Confirmation*

Hi ${tenant.name},

We have received your payment. Thank you!

*Details:*
Amount: ${currencySymbol}${payment.amount.toLocaleString('en-IN')}
Date: ${paymentDate}
For: ${payment.description || payment.category}`;

    // Send the message via WhatsApp
    this.openWhatsApp(tenant.phone, receiptMessage);
}

/**
 * Shares outstanding dues via WhatsApp in both English and Hindi
 * @param {string} tenantId - The ID of the tenant to send dues to
 */
shareDuesWhatsApp(tenantId) {
    // Find the tenant
    const tenant = this.state.tenants.find(tenant => tenant.id === tenantId);
    
    if (!tenant || !tenant.phone) {
        this.showToast('Tenant phone number not found.', 'error');
        return;
    }

    // Get settings for currency and electricity rate
    const { currencySymbol, electricityRate } = this.state.settings;
    
    // Get all dues and payments for this tenant
    const allDues = this.state.dues.filter(due => due.tenantId === tenantId);
    const allPayments = this.state.payments.filter(payment => payment.tenantId === tenantId);
    
    // Calculate total amounts
    const totalDuesAmount = allDues.reduce((sum, due) => sum + due.amount, 0);
    const totalPaymentsAmount = allPayments.reduce((sum, payment) => sum + payment.amount, 0);
    
    // Calculate outstanding balance
    const outstandingBalance = totalDuesAmount - totalPaymentsAmount;
    
    if (outstandingBalance <= 0) {
        this.showToast('No pending dues for this tenant.', 'success');
        return;
    }

    // Prepare dues breakdown in English and Hindi
    const englishDuesList = [];
    const hindiDuesList = [];
    
    allDues.forEach(due => {
        let englishItem = '';
        let hindiItem = '';
        
        if (due.type === 'rent') {
            englishItem = `Rent / किराया: ${currencySymbol}${due.amount}`;
            hindiItem = `किराया: ${currencySymbol}${due.amount}`;
        } 
        else if (due.type === 'utility') {
            // Extract units from description
            const unitsMatch = due.description.match(/(\d+(\.\d+)?)\s*units/);
            const units = unitsMatch ? unitsMatch[1] : 'N/A';
            
            englishItem = `Electricity / बिजली (${units} units @ ${currencySymbol}${electricityRate}/unit): ${currencySymbol}${due.amount}`;
            hindiItem = `बिजली (${units} यूनिट @ ${currencySymbol}${electricityRate}/यूनिट): ${currencySymbol}${due.amount}`;
        } 
        else if (due.type === 'service') {
            englishItem = `${due.description}: ${currencySymbol}${due.amount}`;
            hindiItem = `${due.description}: ${currencySymbol}${due.amount}`;
        }
        
        englishDuesList.push(englishItem);
        hindiDuesList.push(hindiItem);
    });

    // Format English breakdown
    const englishBreakdown = "```\n" + 
        englishDuesList.join('\n') + 
        `\n---------------------\nTOTAL: ${currencySymbol}${outstandingBalance.toLocaleString('en-IN')}` + 
        "\n```";

    // Format Hindi breakdown
    const hindiBreakdown = "```\n" + 
        hindiDuesList.join('\n') + 
        `\n---------------------\nकुल: ${currencySymbol}${outstandingBalance.toLocaleString('en-IN')}` + 
        "\n```";

    // Create final bilingual message
    const duesMessage = `Hi ${tenant.name},

Here is a summary of your outstanding dues.

*Outstanding Dues*
${englishBreakdown}

---

नमस्ते ${tenant.name},

यह आपके बकाया शुल्कों का विवरण है।

*देय राशि*
${hindiBreakdown}

Please clear the balance at your earliest convenience.
कृपया जल्द से जल्द शेष राशि का भुगतान करें।

Thank you / धन्यवाद।`;

    // Send the message via WhatsApp
    this.openWhatsApp(tenant.phone, duesMessage);
}

/**
 * Opens WhatsApp with pre-filled message
 * @param {string} phone - The phone number to send message to
 * @param {string} message - The message content
 */
openWhatsApp(phone, message) {
    // Clean phone number (remove all non-digit characters)
    const cleanedPhone = phone.replace(/\D/g, '');
    
    // Add India country code if not present
    const formattedPhone = cleanedPhone.startsWith('91') ? cleanedPhone : '91' + cleanedPhone;
    
    // Create WhatsApp URL with encoded message
    const whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`;
    
    // Open WhatsApp in new tab
    window.open(whatsappUrl, '_blank');
}
            showToast(msg, type='success') {const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;setTimeout(()=>t.className=t.className.replace('show',''),3000);},
            readFileAsBase64(file) {return new Promise(r=>{if(!file||file.size===0)return r('');const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(file)});},
            previewPhoto(e) {const p=document.getElementById('photo-preview');if(!p)return;const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{p.src=ev.target.result;p.style.display='block';};r.readAsDataURL(f);}},
        };
        app.init();
    });
    </script>
