<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant & Rent Management System</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3e%3crect width='100' height='100' rx='15' fill='%236366f1'/%3e%3ctext x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle'%3eTR%3c/text%3e%3c/svg%3e">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- --- NEW: Google API & Identity Scripts --- -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        :root {
            --primary-color: #6366f1; --primary-hover: #4f46e5; --secondary-color: #10b981;
            --danger-color: #ef4444; --warning-color: #f59e0b; --bg-color: #f3f4f6;
            --text-color: #1f2937; --text-light: #6b7280; --card-bg: #ffffff;
            --border-color: #e5e7eb; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --whatsapp-color: #25D366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%; text-align: center;
        }
        .login-box { background: var(--card-bg); padding: 3rem; border-radius: 12px; box-shadow: var(--shadow); }
        #signin-btn {
            background-color: #4285F4; color: white; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 1rem; transition: background-color 0.3s;
        }
        #signin-btn:hover { background-color: #357ae8; }
        #signin-btn[disabled] { background-color: #ccc; cursor: not-allowed; }
        #signin-btn svg { width: 24px; height: 24px; background: white; border-radius: 50%; padding: 2px; }

        #app-container { display: none; height: 100vh; }
        #app-container.visible { display: flex; }

        .sidebar { width: 260px; background-color: var(--card-bg); padding: 1.5rem; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 2rem; }
        .logo { font-size: 1.8rem; font-weight: 700; color: var(--primary-color); margin-bottom: 2.5rem; text-align: center; }
        .nav-menu { flex-grow: 1; }
        .nav-menu a { display: flex; align-items: center; padding: 0.9rem 1.5rem; margin-bottom: 0.5rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; transition: background-color 0.2s, color 0.2s; cursor: pointer; }
        .nav-menu a:hover { background-color: #f3f4f6; color: var(--primary-color); }
        .nav-menu a.active { background-color: var(--primary-color); color: white; box-shadow: var(--shadow); }
        .user-profile { display: flex; align-items: center; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; }
        .user-profile div { line-height: 1.2; }
        .user-profile span { font-weight: 600; font-size: 0.9rem; }
        #signout-btn { font-size: 0.8rem; color: var(--danger-color); cursor: pointer; background: none; border: none; padding: 0; }
        .view { display: none; } .view.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .section-header .header-actions { display: flex; gap: 1rem; }
        .section-title { font-size: 1.8rem; font-weight: 600; }
        .action-btn { padding: 0.7rem 1.2rem; font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; color: white; display: inline-flex; align-items: center; gap: 0.5rem; }
        .action-btn:hover { transform: translateY(-2px); }
        .btn-primary { background-color: var(--primary-color); } .btn-primary:hover { box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .btn-secondary { background-color: var(--secondary-color); } .btn-secondary:hover { box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        .btn-danger { background-color: var(--danger-color); } .btn-warning { background-color: var(--warning-color); }
        .btn-cancel { background-color: #e5e7eb; color: #374151; }
        .btn-whatsapp { background-color: var(--whatsapp-color); }
        .btn-whatsapp:hover { box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); }
        .transaction-actions { display: flex; gap: 0.5rem; align-items: center; }
        .btn-icon { padding: 0.4rem; line-height: 0; }
        .btn-icon svg { width: 1.2em; height: 1.2em; fill: white; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .data-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .data-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card-photo { width: 100%; height: 180px; background-color: var(--border-color); background-size: cover; background-position: center; position: relative; }
        .card-status { position: absolute; top: 1rem; right: 1rem; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; text-transform: capitalize; backdrop-filter: blur(5px); background-color: rgba(255,255,255,0.7); }
        .status-available { color: #065f46; } .status-occupied { color: #991b1b; }
        .card-content { padding: 1.5rem; flex-grow: 1; } .card-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; } .card-info { color: var(--text-light); font-size: 0.9rem; }
        .metric-boxes { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 2rem; }
        .metric-box { padding: 1.5rem; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); }
        .metric-box h3 { color: var(--text-light); margin-bottom: 1rem; font-size: 1rem; font-weight: 500; } .metric-value { font-size: 2.5rem; font-weight: 700; }
        .dashboard-section { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow); }
        .dashboard-section h3 { font-size: 1.2rem; margin-bottom: 1rem; }
        .alert-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; }
        .alert-item.danger { background-color: #fee2e2; color: #b91c1c; } .alert-item.warning { background-color: #fef3c7; color: #92400e; } .alert-item:hover { opacity: 0.8; }
        .detail-view-header { display: flex; gap: 2rem; margin-bottom: 2rem; align-items: flex-start; }
        .detail-photo { width: 150px; height: 150px; flex-shrink: 0; border-radius: 12px; background-size: cover; background-position: center; background-color: var(--border-color); box-shadow: var(--shadow); }
        .detail-info h2 { font-size: 2rem; margin-bottom: 0.5rem; } .detail-info p { color: var(--text-light); margin-bottom: 0.2rem; }
        .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .detail-main, .detail-sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
        .detail-card { background-color: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow); }
        .detail-card h4 { font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .detail-card ul { list-style: none; padding-left: 0; } .detail-card li { display: flex; justify-content: space-between; padding: 0.5rem 0; }
        .transaction-item { display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding: 0.8rem 0;}
        .transaction-item:last-child { border-bottom: none; }
        .transaction-item.due { color: var(--danger-color); } .transaction-item.payment { color: var(--secondary-color); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: flex-start; justify-content: center; padding-top: 5vh; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background-color: white; padding: 2rem; width: 90%; max-width: 600px; border-radius: 12px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { font-size: 1.5rem; }
        .close-btn { font-size: 2rem; cursor: pointer; background: none; border: none; color: var(--text-light); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        .form-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; }
        #photo-preview { max-width: 100px; max-height: 100px; margin-top: 1rem; border-radius: 8px; object-fit: cover; }
        #toast { position: fixed; bottom: -100px; right: 20px; padding: 1rem 2rem; border-radius: 8px; color: white; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: bottom 0.5s ease-in-out; z-index: 9999; }
        #toast.show { bottom: 20px; } #toast.success { background-color: var(--secondary-color); } #toast.error { background-color: var(--danger-color); }
        @media (max-width: 1024px) { .detail-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            #app-container.visible { flex-direction: column; height: 100%; overflow: auto; }
            .sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-between; align-items: center; padding: 1rem; z-index: 100; box-shadow: var(--shadow); }
            .main-content { overflow-y: visible; padding: 1.5rem; }
            .logo { margin-bottom: 0; }
            .nav-menu { display: flex; gap: 0.5rem; flex-grow: 0; }
            .nav-menu span { display: none; }
            .user-profile { display: none; }
            .detail-view-header { flex-direction: column; align-items: center; text-align: center; }
            .section-header, .section-header .header-actions { justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 class="logo" style="margin-bottom: 1rem;">Mishra Ji</h1>
            <p style="color: var(--text-light); margin-bottom: 2rem;">Tenant & Rent Management System</p>
            <button id="signin-btn" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C42.012 35.841 44 30.138 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                Sign in with Google
            </button>
            <p id="auth-status" style="margin-top: 1rem; color: var(--text-light);">Initializing...</p>
        </div>
    </div>

    <div id="app-container">
        <aside class="sidebar">
            <div>
                <h1 class="logo">Mishra Ji</h1>
                <nav class="nav-menu">
                    <a data-action="navigate" data-view="dashboard" class="nav-link"><span>Dashboard</span></a>
                    <a data-action="navigate" data-view="rooms" class="nav-link"><span>Rooms</span></a>
                    <a data-action="navigate" data-view="tenants" class="nav-link"><span>Tenants</span></a>
                    <a data-action="navigate" data-view="settings" class="nav-link"><span>Settings</span></a>
                </nav>
            </div>
            <div id="user-profile-container" class="user-profile" style="display: none;">
                <img id="user-img" src="" alt="User">
                <div>
                    <span id="user-name"></span>
                    <button id="signout-btn">Sign Out</button>
                </div>
            </div>
        </aside>
        <main class="main-content" id="main-content-area"></main>
    </div>

    <div id="modal-container"></div>
    <div id="toast"></div>

<script>
// Wrap the entire script in a function that waits for the window to load.
// This ensures gapi and google objects are available from the async scripts.
window.onload = () => {
    const app = {
        // --- NEW: GIS and GAPI Config ---
        CLIENT_ID: '460969544827-21ethacfepnho56k8j89dtaq58rj0oem.apps.googleusercontent.com',
        API_KEY: 'AIzaSyDJ3soSuJgHcbD8beauFPWd06wJWqws3ps',
        SCOPES: 'https://www.googleapis.com/auth/drive.file',
        DRIVE_FILE_NAME: 'trms_data.json',
        driveFileId: null,
        isSaving: false,
        tokenClient: null,

        state: {
            rooms: [], tenants: [], dues: [], payments: [], utilityReadings: [],
            settings: { electricityRate: 8.00, currencySymbol: '₹' },
            currentView: 'dashboard', detailViewId: null
        },

        // --- REWRITTEN: Authentication Flow ---
        init() {
            // 1. Initialize GAPI client for Google Drive API calls
            gapi.load('client', this.initializeGapiClient.bind(this));

            // 2. Initialize GIS client for authentication
            this.tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: this.CLIENT_ID,
                scope: this.SCOPES,
                callback: this.handleAuthResponse.bind(this), // Main function after sign-in
            });

            // 3. Add listeners to buttons
            document.getElementById('signin-btn').addEventListener('click', () => this.tokenClient.requestAccessToken({prompt: 'consent'}));
            document.getElementById('signout-btn').addEventListener('click', this.signOut.bind(this));
        },

        async initializeGapiClient() {
            await gapi.client.init({
                apiKey: this.API_KEY,
                discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
            });
            // Enable the sign-in button once the API client is ready
            document.getElementById('signin-btn').disabled = false;
            document.getElementById('auth-status').textContent = 'Ready. Please sign in.';
        },

        async handleAuthResponse(response) {
            const authStatus = document.getElementById('auth-status');
            if (response.error) {
                authStatus.textContent = 'Authentication error. Please try again.';
                this.showToast(`Error: ${response.error}`, 'error');
                return;
            }

            // A token is received, so the user is signed in.
            authStatus.textContent = 'Loading data...';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').classList.add('visible');
            
            await this.updateUserProfile();
            await this.loadData();
            this.startAppLogic();
        },

        signOut() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token, () => {
                    gapi.client.setToken('');
                    this.driveFileId = null; // Reset file ID
                    // Reset UI
                    document.getElementById('login-screen').style.display = 'flex';
                    document.getElementById('app-container').classList.remove('visible');
                    document.getElementById('auth-status').textContent = 'You have been signed out.';
                    this.showToast('Signed out successfully.');
                });
            }
        },

        async updateUserProfile() {
            try {
                const response = await gapi.client.request({
                    path: 'https://www.googleapis.com/oauth2/v3/userinfo'
                });
                const user = response.result;
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-img').src = user.picture;
                document.getElementById('user-profile-container').style.display = 'flex';
            } catch (e) {
                console.error("Could not fetch user profile", e);
                document.getElementById('user-name').textContent = 'User';
                document.getElementById('user-profile-container').style.display = 'flex';
            }
        },
        
        startAppLogic() {
            const duesGenerated = this.generateMissingRentDues();
            if (duesGenerated > 0) {
                this.saveData();
                this.showToast(`${duesGenerated} new rent due(s) generated.`);
            }
            this.addEventListeners();
            this.navigateTo('dashboard');
        },

        async loadData() {
            this.showToast("Loading data from Google Drive...");
            try {
                const response = await gapi.client.drive.files.list({
                    q: `name='${this.DRIVE_FILE_NAME}' and trashed=false`,
                    spaces: 'drive',
                    fields: 'files(id, name)'
                });

                if (response.result.files && response.result.files.length > 0) {
                    this.driveFileId = response.result.files[0].id;
                    const fileContentResponse = await gapi.client.drive.files.get({
                        fileId: this.driveFileId,
                        alt: 'media'
                    });
                    const loadedState = JSON.parse(fileContentResponse.body);
                    this.state = { ...this.state, ...loadedState };
                    this.state.settings = { ...this.state.settings, ...loadedState.settings };
                    this.showToast("Data loaded successfully!", "success");
                } else {
                    this.showToast("No data file found. Starting fresh.", "success");
                }
            } catch (e) {
                console.error("Error loading data from Drive:", e);
                this.showToast("Failed to load data from Drive.", "error");
            }
        },

        async saveData() {
            if (this.isSaving) return;
            this.isSaving = true;

            const dataToSave = JSON.stringify(this.state);
            const metadata = { name: this.DRIVE_FILE_NAME, mimeType: 'application/json' };
            const blob = new Blob([dataToSave], { type: 'application/json' });
            const form = new FormData();

            try {
                if (this.driveFileId) {
                    form.append('metadata', new Blob([JSON.stringify({ mimeType: 'application/json' })], { type: 'application/json' }));
                    form.append('file', blob);
                    await gapi.client.request({
                        path: `/upload/drive/v3/files/${this.driveFileId}`,
                        method: 'PATCH',
                        params: { uploadType: 'multipart' },
                        body: form
                    });
                } else {
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', blob);
                    const response = await gapi.client.request({
                        path: '/upload/drive/v3/files',
                        method: 'POST',
                        params: { uploadType: 'multipart' },
                        body: form
                    });
                    this.driveFileId = response.result.id;
                }
            } catch (e) {
                console.error("Error saving data to Drive:", e);
                this.showToast("Failed to save data to Drive.", "error");
            } finally {
                this.isSaving = false;
            }
        },

        navigateTo(v, id=null) { this.state.currentView=v;this.state.detailViewId=id;this.render(); },
        render() { const{currentView:v,detailViewId:id}=this.state;const m=document.getElementById('main-content-area');const k=v.includes('-')?v.split('-').map((p,i)=>i>0?p.charAt(0).toUpperCase()+p.slice(1):p).join(''):v;const f=this.templates[k];if(f)m.innerHTML=f.call(this,id);else m.innerHTML=`<p>Error: View '${v}' not found.</p>`;document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.view===v.split('-')[0]));},
        addEventListeners() { document.body.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;e.preventDefault();const{action:a,view:v,id:i,modalType:m,itemType:it}=t.dataset;const A={'navigate':()=>this.navigateTo(v),'navigate-detail':()=>this.navigateTo(v,i),'show-modal':()=>this.showModal(m,i),'close-modal':()=>this.closeModal(),'delete-item':()=>{if(confirm(`Delete this ${it.replace('-',' ')}? This cannot be undone.`))this.deleteItem(it,i);},'generate-receipt':()=>this.generateReceipt(i),'generate-statement':()=>this.generateMonthlyStatement(i),'report-meter-broken':()=>{if(confirm('Report meter as broken?'))this.reportMeterBroken(i);},'install-new-meter':()=>this.installNewMeter(i),'share-receipt-whatsapp':()=>this.shareReceiptWhatsApp(i),'share-dues-whatsapp':()=>this.shareDuesWhatsApp(i),};if(A[a])A[a]();});document.body.addEventListener('submit',e=>{e.preventDefault();const h={'room-form':f=>this.handleRoomSubmit(f),'tenant-form':f=>this.handleTenantSubmit(f),'settings-form':f=>this.handleSettingsSubmit(f),'utility-form':f=>this.handleUtilitySubmit(f),'payment-form':f=>this.handlePaymentSubmit(f),'service-charge-form':f=>this.handleServiceChargeSubmit(f),'edit-room-form':f=>this.handleEditRoomSubmit(f),'edit-tenant-form':f=>this.handleEditTenantSubmit(f),};if(h[e.target.id])h[e.target.id](e.target);});document.body.addEventListener('change',e=>{if(e.target.matches('input[type="file"]')&&e.target.id!=='import-file-input')this.previewPhoto(e);});},
        
        // --- TEMPLATES (Unchanged) ---
        templates: {

        installNewMeter(rId) {const i=parseInt(prompt("Initial reading of new meter:","0"));if(isNaN(i))return;const r=this.state.rooms.find(rm=>rm.id===rId);if(r){r.meterStatus='ok';r.meterInstallationId=`m_${Date.now()}`;}this.state.utilityReadings.push({id:`ur_${Date.now()}`,roomId:rId,date:new Date().toISOString(),reading:i,meterInstallationId:r.meterInstallationId});this.saveData();this.render();this.showToast('New meter installed!');},
        generateMissingRentDues() { let c=0;const t=new Date();t.setHours(0,0,0,0);this.state.tenants.forEach(tn=>{const r=this.state.rooms.find(rm=>rm.id===tn.roomId);if(!r||!tn.moveInDate)return;let dD=new Date(tn.moveInDate);dD.setHours(0,0,0,0);dD.setMonth(dD.getMonth()+1);while(dD<=t){const dY=dD.getFullYear(),dM=dD.getMonth();const aE=this.state.dues.some(due=>due.tenantId===tn.id&&due.type==='rent'&&new Date(due.date).getFullYear()===dY&&new Date(due.date).getMonth()===dM);if(!aE){this.state.dues.push({id:`due_${dD.getTime()}_${tn.id}`,tenantId:tn.id,amount:r.rent,date:dD.toISOString(),type:'rent',description:`Monthly Rent`});c++;}dD.setMonth(dD.getMonth()+1);}});return c;},
        generateMonthlyStatement(tId){const t=this.state.tenants.find(tn=>tn.id===tId),trs=[...this.state.dues.filter(d=>d.tenantId===tId),...this.state.payments.filter(p=>p.tenantId===tId)].sort((a,b)=>new Date(a.date)-new Date(b.date));let h=`<h2>Statement for ${t.name}</h2><hr>`;trs.forEach(tr=>{h+=`<p>${new Date(tr.date).toLocaleDateString()}: ${tr.description||tr.type} - <strong>${tr.amount}</strong></p>`});const w=window.open('','Statement');w.document.write(h);w.document.close();},
        generateReceipt(pId) {const p=this.state.payments.find(pm=>pm.id===pId),t=this.state.tenants.find(tn=>tn.id===p.tenantId),w=window.open('','Receipt');w.document.write(`<html><body style="font-family:sans-serif;padding:2rem;"><h1>Payment Receipt</h1><hr><p><strong>Received From:</strong> ${t.name}</p><p><strong>Amount:</strong> ${this.state.settings.currencySymbol}${p.amount.toLocaleString('en-IN')}</p><p><strong>Date:</strong> ${new Date(p.date).toLocaleString()}</p><p><strong>For:</strong> ${p.description||p.category}</p><hr><p>Thank you!</p></body></html>`);w.document.close();w.print();},
        shareReceiptWhatsApp(paymentId) { const p=this.state.payments.find(pm=>pm.id===paymentId);if(!p)return;const t=this.state.tenants.find(tn=>tn.id===p.tenantId);if(!t||!t.phone){this.showToast('Tenant phone number not found.','error');return;}const{currencySymbol:cS}=this.state.settings;const m=`*Payment Confirmation*\n\nHi ${t.name},\n\nWe have received your payment. Thank you!\n\n*Details:*\nAmount: ${cS}${p.amount.toLocaleString('en-IN')}\nDate: ${new Date(p.date).toLocaleDateString()}\nFor: ${p.description||p.category}`;this.openWhatsApp(t.phone,m);},
        shareDuesWhatsApp(tenantId) { const t=this.state.tenants.find(tn=>tn.id===tenantId);if(!t||!t.phone){this.showToast('Tenant phone number not found.','error');return;}const{currencySymbol:cS,electricityRate:eR}=this.state.settings;const aD=this.state.dues.filter(d=>d.tenantId===tenantId),aP=this.state.payments.filter(p=>p.tenantId===tenantId);const tDA=aD.reduce((s,d)=>s+d.amount,0),tPA=aP.reduce((s,p)=>s+p.amount,0);const b=tDA-tPA;if(b<=0){this.showToast('No pending dues for this tenant.','success');return;}const eL=[],hL=[];aD.forEach(d=>{let e='',h='';if(d.type==='rent'){e=`Rent / किराया: ${cS}${d.amount}`;h=`किराया: ${cS}${d.amount}`;}else if(d.type==='utility'){const uM=d.description.match(/(\d+(\.\d+)?)\s*units/),u=uM?uM[1]:'N/A';e=`Electricity / बिजली (${u} units @ ${cS}${eR}/unit): ${cS}${d.amount}`;h=`बिजली (${u} यूनिट @ ${cS}${eR}/यूनिट): ${cS}${d.amount}`;}else if(d.type==='service'){e=`${d.description}: ${cS}${d.amount}`;h=`${d.description}: ${cS}${d.amount}`;}eL.push(e);hL.push(h);});const eB="```\n"+eL.join('\n')+`\n---------------------\nTOTAL: ${cS}${b.toLocaleString('en-IN')}`+"\n```";const hB="```\n"+hL.join('\n')+`\n---------------------\nकुल: ${cS}${b.toLocaleString('en-IN')}`+"\n```";const fM=`Hi ${t.name},\n\nHere is a summary of your outstanding dues.\n\n*Outstanding Dues*\n${eB}\n\n---\n\nनमस्ते ${t.name},\n\nयह आपके बकाया शुल्कों का विवरण है।\n\n*देय राशि*\n${hB}\n\nPlease clear the balance at your earliest convenience.\nकृपया जल्द से जल्द शेष राशि का भुगतान करें।\n\nThank you / धन्यवाद।`;this.openWhatsApp(t.phone,fM);},
        openWhatsApp(phone, message) { const cP=phone.replace(/\D/g,''),fP=cP.startsWith('91')?cP:'91'+cP;const u=`https://wa.me/${fP}?text=${encodeURIComponent(message)}`;window.open(u,'_blank');},
        showToast(msg, type='success') {const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;setTimeout(()=>t.className=t.className.replace('show',''),3000);},
        readFileAsBase64(file) {return new Promise(r=>{if(!file||file.size===0)return r('');const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(file)});},
        previewPhoto(e) {const p=document.getElementById('photo-preview');if(!p)return;const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{p.src=ev.target.result;p.style.display='block';};r.readAsDataURL(f);}},
    };

    // Start the application
    app.init();
};
</script>
