<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- 1. Sidebar Navigation -->
    <nav class="sidebar">
        <h2>Tenant Mgr</h2>
        <ul>
            <li onclick="switchView('dashboard')" class="active">Dashboard</li>
            <li onclick="switchView('rooms')">Rooms</li>
            <li onclick="switchView('tenants')">Tenants</li>
            <li onclick="switchView('dues')">Dues & Payments</li>
            <li onclick="switchView('readings')">Utility Readings</li>
            <li onclick="switchView('settings')">Settings</li>
        </ul>


        <!-- Temporary Setup Button -->
<button id="uploadBtn" style="background-color: #f59e0b; margin-top: 10px;">Upload JSON Data</button>
        <button id="logoutBtn" style="margin-top: auto;">Logout</button>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="content">
        <header>
            <h1 id="pageTitle">Overview</h1>
            <div id="userInfo">Loading...</div>
        </header>

        <!-- Dynamic Content loads here -->
        <div id="appContainer">
            <p>Loading data from Firebase...</p>
        </div>
    </main>

    <!-- 3. Link JavaScript Files (Module type is required for Firebase) -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- Simple View Switcher Script (For basic navigation) -->
    <script>
        function switchView(viewName) {
            console.log("Switching to:", viewName);
            document.getElementById('pageTitle').innerText = viewName.charAt(0).toUpperCase() + viewName.slice(1);
            // We will add logic in app.js to actually change the content
        }
    </script>
</body>
</html>
